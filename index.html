<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EN–TR Study</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    --bg: #f2f2f2;
    --card: #ffffff;
    --text: #111;
    --muted: #666;
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg: #0f1115;
        --card: #1a1d24;
        --text: #f1f1f1;
        --muted: #9aa0a6;
    }
}

body {
    font-family: system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
}

h1 {
    text-align: center;
}

input, button {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    margin-top: 10px;
}

input {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--muted);
}

input::placeholder {
    color: var(--muted);
}


.card {
    margin-top: 20px;
    background: var(--card);
    border-radius: 18px;
    padding: 32px 24px;

    min-height: calc(100vh - 200px);

    display: flex;
    flex-direction: column;
    justify-content: space-between;

    cursor: pointer;

    pointer-events: none;
    opacity: 0.5;

    -webkit-tap-highlight-color: transparent;
    outline: none;
}


.started .card {
    pointer-events: auto;
    opacity: 1;
}


.en {
    font-weight: 700;
    font-size: 36px;
}

.tr {
    font-size: 32px;
    opacity: 0;
}


.reveal .tr {
    opacity: 1;
    visibility: visible;
}


.spacer {
    flex: 1;
}
</style>
</head>

<body>

<div id="setup">
    <input id="range" placeholder="Which day interval? (e.g. 1-15)">
    <button onclick="start()">Start</button>
</div>

<div class="card" id="card" onclick="toggle()">
    <div class="en"></div>
    <div class="spacer"></div>
    <div class="tr"></div>
</div>

<script>
let words = [];
let current = null;
let revealed = false;

async function start() {
    words = [];

    const input = document.getElementById("range").value.trim();
    const match = input.match(/^(\d+)\s*-\s*(\d+)$/);

    if (!match) {
        alert("Use format like 1-15");
        return;
    }

    let startDay = parseInt(match[1]);
    let endDay = parseInt(match[2]);

    if (startDay > endDay) {
        [startDay, endDay] = [endDay, startDay];
    }

    for (let d = startDay; d <= endDay; d++) {
        const data = await fetch(`words/${d}.json`).then(r => r.json());
        words.push(...data);
    }

    if (words.length === 0) {
        alert("No words found");
        return;
    }

    shuffle(words);
    nextWord();

    document.getElementById("setup").style.display = "none";
    document.body.classList.add("started");
}

function nextWord() {
    current = words[Math.floor(Math.random() * words.length)];
    revealed = false;
    render();
}

function toggle() {
    if (!revealed) {
        revealed = true;
        render();
    } else {
        nextWord();
    }
}

function render() {
    const card = document.getElementById("card");
    card.classList.toggle("reveal", revealed);

    document.querySelector(".en").textContent = current[0];
    document.querySelector(".tr").textContent = current[1];
}

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}
</script>

</body>
</html>
