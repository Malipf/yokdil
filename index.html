<script>
    let words = [];
    let current = null;
    let revealed = false;

    function parseDays(input) {
        const days = new Set();
        const parts = input.split(",");

        for (const part of parts) {
            if (part.includes("-")) {
                const [a, b] = part.split("-").map(Number);
                if (!a || !b) throw Error();

                const start = Math.min(a, b);
                const end = Math.max(a, b);

                for (let i = start; i <= end; i++) {
                    days.add(i);
                }
            } else {
                const n = Number(part);
                if (!n) throw Error();
                days.add(n);
            }
        }

        return [...days].sort((a, b) => a - b);
    }

    async function start() {
        words = [];

        const input = document
            .getElementById("range")
            .value
            .trim();

        // ✅ EMPTY → load all.json
        if (input === "") {
            const res = await fetch("words/all.json");
            if (!res.ok) {
                alert("all.json bulunamadı");
                return;
            }

            words = await res.json();
        } else {
            // ➕ specific days
            let days;
            try {
                days = parseDays(input);
            } catch {
                alert("Geçersiz format");
                return;
            }

            const requests = days.map(d =>
                fetch(`words/${d}.json`)
                    .then(r => r.ok ? r.json() : [])
            );

            const results = await Promise.all(requests);
            words = results.flat();
        }

        if (words.length === 0) {
            alert("Kelime bulunamadı");
            return;
        }

        shuffle(words);
        nextWord();

        document.getElementById("setup").style.display = "none";
        document.body.classList.add("started");
    }

    function nextWord() {
        current = words[Math.floor(Math.random() * words.length)];
        revealed = false;
        render();
    }

    function toggle() {
        if (!revealed) {
            revealed = true;
            render();
        } else {
            nextWord();
        }
    }

    function render() {
        const card = document.getElementById("card");
        card.classList.toggle("reveal", revealed);

        document.querySelector(".en").textContent = current[0];
        document.querySelector(".tr").textContent = current[1];
    }

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
    }
</script>
